<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Direction de jeu — Serious Game</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Thème posé avant le rendu : évite le clignotement au chargement. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("sg.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="tag" data-i18n="app.name">Serious Game</span>
        <span id="session-name">—</span>
      </div>
      <span class="badge" id="session-status">—</span>
      <div class="spacer"></div>
      <span class="row tight small muted">
        <i class="dot" data-conn-dot></i>
        <span data-conn-label></span>
      </span>
      <a class="btn btn-sm btn-ghost" href="/records.html" data-i18n="nav.records">Historique</a>
      <a class="btn btn-sm btn-ghost" href="/" data-i18n="nav.home">Accueil</a>
      <div class="row tight">
        <button class="btn btn-lang" data-lang-btn="fr">FR</button>
        <button class="btn btn-lang" data-lang-btn="en">EN</button>
      </div>
    </header>

    <main class="shell">
      <div class="split">
        <!-- =============================================== colonne gauche -->
        <div class="stack">
          <!-- accès joueurs -->
          <section class="panel">
            <div class="grid cols-2" style="align-items: center">
              <div>
                <div class="label" data-i18n="admin.code">Code de session</div>
                <div class="code-display" id="session-code">------</div>
                <div class="row tight" style="margin-top: 8px">
                  <button class="btn btn-sm" id="copy-code" data-i18n="btn.copy">Copier</button>
                  <button class="btn btn-sm" id="copy-link" data-i18n="admin.joinUrl">
                    Lien joueurs
                  </button>
                </div>
              </div>
              <div>
                <div class="label" data-i18n="admin.joinUrl">Lien joueurs</div>
                <div class="join-url" id="join-link">—</div>
                <p class="small muted" style="margin: 8px 0 0" data-i18n="admin.projectHint"></p>
              </div>
            </div>
            <div class="divider"></div>
            <div class="grid cols-4">
              <div class="metric">
                <div class="k" data-i18n="admin.tables">Tables</div>
                <div class="v" id="m-tables">0</div>
              </div>
              <div class="metric">
                <div class="k" data-i18n="admin.players">Joueurs</div>
                <div class="v" id="m-players">0</div>
              </div>
              <div class="metric">
                <div class="k" data-i18n="rec.eventsCol">Événements</div>
                <div class="v" id="m-events">0</div>
              </div>
              <div class="metric">
                <div class="k" data-i18n="admin.live">Vote en cours</div>
                <div class="v" id="m-live">0</div>
              </div>
            </div>
          </section>

          <!-- suivi des tables -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.tables">Tables</h2>
              <div class="spacer"></div>
              <span class="badge" id="tables-count"></span>
              <button class="btn btn-sm" id="btn-add-team" data-i18n="admin.addTable">
                Ajouter une table
              </button>
            </div>
            <div class="team-grid" id="teams-host"></div>
          </section>

          <!-- classement par événement -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.eventRanks">Classement par événement</h2>
            </div>
            <div id="ranks-host"></div>
          </section>

          <!-- déroulé -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.deck">Déroulé des événements</h2>
              <div class="spacer"></div>
              <button class="btn btn-sm" id="btn-new-event" data-i18n="admin.newEvent">
                Créer un événement
              </button>
            </div>
            <div class="list" id="deck-host"></div>
          </section>
        </div>

        <!-- =============================================== colonne droite -->
        <div class="stack">
          <!-- dévoilement -->
          <section class="panel" id="reveal-panel">
            <div class="panel-head">
              <h2 data-i18n="admin.overview">Vue d’ensemble</h2>
            </div>
            <div id="reveal-host"></div>
          </section>

          <!-- classement général -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.leaderboard">Classement général</h2>
            </div>
            <div class="table-wrap" id="board-host"></div>
            <p class="small muted" style="margin: 10px 0 0" data-i18n="admin.noIndividual"></p>
          </section>

          <!-- réglages -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.settings">Réglages de la session</h2>
            </div>
            <label class="field">
              <span data-i18n="admin.duration">Durée du vote (secondes)</span>
              <input type="number" id="set-duration" min="5" max="3600" step="10" />
            </label>
            <label class="field">
              <span data-i18n="admin.arbitration">Temps d’arbitrage (secondes)</span>
              <input type="number" id="set-arbitration" min="5" max="600" step="5" />
            </label>
            <label class="field">
              <span data-i18n="admin.teamSizeSetting">Joueurs par table</span>
              <input type="number" id="set-teamsize" min="2" max="10" step="1" />
            </label>
            <label class="checkline">
              <input type="checkbox" id="set-autoassign" />
              <span data-i18n="admin.autoAssign"></span>
            </label>
            <label class="checkline">
              <input type="checkbox" id="set-autoclose" />
              <span data-i18n="admin.autoClose"></span>
            </label>
            <label class="checkline">
              <input type="checkbox" id="set-allowchange" />
              <span data-i18n="admin.allowChange"></span>
            </label>
            <label class="checkline">
              <input type="checkbox" id="set-latejoin" />
              <span data-i18n="admin.allowLateJoin"></span>
            </label>
            <div class="divider"></div>
            <div class="row">
              <button class="btn btn-sm btn-danger" id="btn-end-session" data-i18n="admin.endSession">
                Terminer et archiver
              </button>
              <button class="btn btn-sm hidden" id="btn-reopen" data-i18n="admin.reopen">
                Reprendre la session
              </button>
            </div>
          </section>

          <!-- rôles -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.roles">Rôles et missions</h2>
            </div>
            <div id="roles-host"></div>
          </section>

          <!-- journal -->
          <section class="panel">
            <div class="panel-head">
              <h2 data-i18n="admin.log">Journal de la session</h2>
            </div>
            <div class="log" id="log-host"></div>
          </section>
        </div>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/cards.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
