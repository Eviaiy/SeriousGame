<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Mon poste — Serious Game</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Thème posé avant le rendu : évite le clignotement au chargement. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("sg.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="tag" data-i18n="app.name">Serious Game</span>
        <span data-i18n="app.name">Serious Game</span>
      </div>
      <span class="badge" id="team-badge">—</span>
      <div class="spacer"></div>
      <span class="row tight small muted">
        <i class="dot" data-conn-dot></i>
        <span data-conn-label></span>
      </span>
      <div class="row tight">
        <button class="btn btn-lang" data-lang-btn="fr">FR</button>
        <button class="btn btn-lang" data-lang-btn="en">EN</button>
      </div>
    </header>

    <main class="shell narrow dock-pad">
      <!-- récit d'ouverture, tant que le premier événement n'a pas commencé -->
      <section id="narrative-host" style="margin-bottom: 16px"></section>

      <!-- mon rôle -->
      <section id="role-host"></section>

      <!-- scène de jeu -->
      <section id="stage" class="stack" style="margin-top: 16px"></section>

      <!-- autour de la table -->
      <section class="panel" style="margin-top: 16px">
        <div class="panel-head">
          <h2 data-i18n="play.teamRoster">Autour de la table</h2>
          <span class="badge" id="roster-count">—</span>
        </div>
        <div id="roster-host"></div>
      </section>

      <div class="row" style="margin-top: 18px">
        <div class="spacer"></div>
        <button class="btn btn-sm btn-ghost btn-danger" id="btn-leave" data-i18n="play.leave">
          Quitter
        </button>
      </div>
    </main>

    <!-- barre de vote : la question, le chrono et les réponses restent au pouce -->
    <div class="vote-dock hidden" id="dock">
      <div id="dock-timer"></div>
      <div class="dock-status">
        <div class="dock-question" id="dock-question"></div>
        <div class="dock-line">
          <span class="badge" id="dock-badge">—</span>
          <span class="small muted" id="dock-hint"></span>
        </div>
      </div>
      <div class="dock-actions" id="dock-actions"></div>
      <div class="dock-choices" id="dock-choices"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/cards.js"></script>
    <script src="/js/play.js"></script>
  </body>
</html>
