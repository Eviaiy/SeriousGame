<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Console de table — Serious Game</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Thème posé avant le rendu : évite le clignotement au chargement. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("sg.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <a class="tag" href="/" data-i18n="app.name" aria-label="Serious Game">Serious Game</a>
        <a class="brand-home" href="/" data-i18n="app.name">Serious Game</a>
      </div>
      <span class="badge" id="session-status">—</span>
      <div class="spacer"></div>
      <div class="row tight">
        <button class="btn btn-lang" data-lang-btn="fr">FR</button>
        <button class="btn btn-lang" data-lang-btn="en">EN</button>
      </div>
    </header>

    <main class="shell narrow dock-pad">
      <!-- entête de table -->
      <section class="panel tight">
        <!-- le jeu, puis « Table n • Animée par … » -->
        <div class="table-card-heading">
          <div class="title game-name" id="table-game-name">—</div>
          <div class="table-line">
            <span class="title" id="team-title">—</span>
            <span class="team-host hidden" id="team-host"></span>
          </div>
        </div>
        <div class="small muted" style="margin-top: 6px" data-i18n="team.facilitatorRole"></div>
        <div style="margin-top: 16px">
          <button class="btn btn-sm" id="btn-player-qr" type="button" data-i18n="admin.playerTableQrButton">
            Ajouter un joueur
          </button>
        </div>
        <div class="label" style="margin-top: 12px" data-i18n="admin.progress">Avancement</div>
        <div class="progress-track" style="margin-top: 12px">
          <i class="progress-fill" id="progress-fill" style="width: 0%"></i>
        </div>
        <div class="row small muted" style="margin-top: 8px">
          <span id="progress-label">—</span>
          <div class="spacer"></div>
          <span id="presence-label">—</span>
        </div>
      </section>

      <!-- scène : ce que l'animateur pilote doit rester au-dessus du pli -->
      <section id="stage" class="stack" style="margin-top: 16px"></section>

      <!-- bilan de l'acte terminé / scores encore scellés -->
      <section id="sealed-host" class="stack" style="margin-top: 16px"></section>

      <!-- composition -->
      <section class="panel" style="margin-top: 16px">
        <div class="panel-head">
          <h2 data-i18n="team.roster">Composition et rôles</h2>
          <span class="badge" id="roster-count">—</span>
        </div>
        <div class="small muted" data-i18n="team.rosterHint"></div>
        <div style="margin-top: 12px" id="roster-host"></div>
      </section>

      <!-- historique -->
      <section class="panel" style="margin-top: 16px">
        <div class="panel-head">
          <h2 data-i18n="team.history">Événements joués</h2>
        </div>
        <div id="history-host"></div>
      </section>

    </main>

    <!-- commandes de la manche -->
    <div class="vote-dock is-controls hidden" id="dock">
      <div id="dock-timer"></div>
      <div class="dock-actions" id="dock-actions"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/cards.js"></script>
    <script src="/js/qr.js"></script>
    <script src="/js/team.js"></script>
  </body>
</html>
