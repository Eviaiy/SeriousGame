<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>Console de table — Serious Game</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Thème posé avant le rendu : évite le clignotement au chargement. */
      (function () {
        var t;
        try {
          t = localStorage.getItem("sg.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="tag" data-i18n="app.name">Serious Game</span>
        <span id="team-name">—</span>
      </div>
      <span class="badge" id="session-status">—</span>
      <div class="spacer"></div>
      <span class="row tight small muted">
        <i class="dot" data-conn-dot></i>
        <span data-conn-label></span>
      </span>
      <div class="row tight">
        <button class="btn btn-lang" data-lang-btn="fr">FR</button>
        <button class="btn btn-lang" data-lang-btn="en">EN</button>
      </div>
    </header>

    <main class="shell narrow dock-pad">
      <!-- entête de table -->
      <section class="panel tight">
        <div class="row">
          <div class="grow">
            <div class="label" data-i18n="team.myTable">Ma table</div>
            <div class="team-title" id="team-title">—</div>
            <div class="small muted" data-i18n="team.facilitatorRole"></div>
          </div>
          <div class="center">
            <div class="label" data-i18n="admin.progress">Avancement</div>
            <div class="rank-big" id="progress-count">0</div>
          </div>
        </div>
        <div class="progress-track" style="margin-top: 12px">
          <i class="progress-fill" id="progress-fill" style="width: 0%"></i>
        </div>
        <div class="row small muted" style="margin-top: 8px">
          <span id="progress-label">—</span>
          <div class="spacer"></div>
          <span id="presence-label">—</span>
        </div>
      </section>

      <!-- scène : ce que l'animateur pilote doit rester au-dessus du pli -->
      <section id="stage" class="stack" style="margin-top: 16px"></section>

      <!-- composition -->
      <section class="panel" style="margin-top: 16px">
        <div class="panel-head">
          <h2 data-i18n="team.roster">Composition et rôles</h2>
          <span class="badge" id="roster-count">—</span>
        </div>
        <div class="small muted" data-i18n="team.rosterHint"></div>
        <div style="margin-top: 12px" id="roster-host"></div>
      </section>

      <!-- scores scellés -->
      <section id="sealed-host" style="margin-top: 16px"></section>

      <!-- historique -->
      <section class="panel" style="margin-top: 16px">
        <div class="panel-head">
          <h2 data-i18n="team.history">Événements joués</h2>
        </div>
        <div id="history-host"></div>
      </section>

      <div class="row" style="margin-top: 18px">
        <a class="btn btn-sm btn-ghost" href="/" data-i18n="nav.home">Accueil</a>
        <div class="spacer"></div>
      </div>
    </main>

    <!-- commandes de la manche -->
    <div class="vote-dock is-controls hidden" id="dock">
      <div id="dock-timer"></div>
      <div class="dock-actions" id="dock-actions"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/cards.js"></script>
    <script src="/js/team.js"></script>
  </body>
</html>
